version: 2

updates:
  # Python dependencies declared in pyproject.toml (runtime + dev/ai optional extras).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Actions referenced by .github/workflows/*.yml (pinned to commit SHAs -- Dependabot still
  # tracks and proposes updates for SHA-pinned actions, updating the trailing version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
