[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-investigator"
version = "0.1.0"
description = "Evidence-first, read-only Kubernetes Pod investigation CLI with deterministic diagnostic rules and optional AI hypotheses"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gaurav Joshi" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: System Administrators",
    "Environment :: Console",
]
dependencies = [
    "pydantic>=2.6,<3",
    "kubernetes>=29,<32",
    "pyyaml>=6,<7",  # custom knowledge-pack loading (Phase 0.18) -- core functionality,
    # available with AI fully disabled, so this is a direct dependency, not an extra.
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
# Optional: only required to actually run the OpenAI-backed HypothesisModelClient
# (ai/openai_client.py). The deterministic pipeline, and the entire offline test suite
# (tests/test_ai_openai_client.py included -- it injects a fake raw client), need none of this.
ai = ["openai>=1,<2"]

[project.scripts]
kai = "k8s_investigator.cli:main"
investigate = "k8s_investigator.cli:main"  # trivial, backward-compatible alias for kai

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Deliberately a small, uncontroversial correctness-only rule set -- not the full default
# selection (which includes import-sorting/style rules this project has never adopted and
# would require a broad reformatting pass to satisfy). F = pyflakes (unused imports/variables,
# undefined names, etc.); E9 = syntax errors. Expanding this set is a separate, deliberate
# decision, not something to do incidentally.
select = ["F", "E9"]
