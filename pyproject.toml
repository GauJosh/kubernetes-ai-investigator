[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-investigator"
version = "0.1.0"
description = "Evidence-first, read-only Kubernetes Pod investigation CLI with deterministic diagnostic rules and optional AI hypotheses"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pydantic>=2.6,<3",
    "kubernetes>=29,<32",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
# Optional: only required to actually run the OpenAI-backed HypothesisModelClient
# (ai/openai_client.py). The deterministic pipeline, and the entire offline test suite
# (tests/test_ai_openai_client.py included -- it injects a fake raw client), need none of this.
ai = ["openai>=1,<2"]

[project.scripts]
investigate = "k8s_investigator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
